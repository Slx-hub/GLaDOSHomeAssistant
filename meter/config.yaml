# meter.service configuration — no secrets in here!
# The box password comes from the FRITZBOX_PASSWORD env var
# (systemd EnvironmentFile /etc/meter.env, mode 0600) or from password_file.

fritzbox:
  host: 192.168.178.1        # IP on purpose, never rely on fritz.box resolving
  user: Glados               # box user account with Smart Home permission
  password_file: null        # alternative to FRITZBOX_PASSWORD, path outside the repo
  ain: "15282 0921804-1"     # sub-unit carries <powermeter>; the bare AIN does not
  use_https: false
  verify_tls: false
  timeout_s: 10.0
  login_backoff_initial_s: 10.0
  login_backoff_max_s: 900.0
  # --- UNVERIFIED for the Energy 250, see spec section 2 -------------------
  # Defaults are the FRITZ!DECT 200 units (power mW, energy Wh). Verify with
  # --dump-raw against the meter display before trusting any published value.
  power_scale: 0.001         # raw -> W
  energy_scale: 0.001        # raw -> kWh
  invert_sign: false         # flip if feed-in shows the wrong sign
  export_element: null       # XML element carrying counter 2.8.0, once known
  # -------------------------------------------------------------------------

poll:
  interval_s: 5.0            # device sends every 10s; poll faster so no update is missed
  stale_after_s: 180.0       # measured: the device pauses transmitting for up to 120s in power saving mode

mqtt:
  host: localhost
  port: 1883
  keepalive_s: 30            # bounds how fast the LWT flips status to offline after kill -9
  topic_prefix: powermeter   # separate namespace from hermes/ (Rhasspy)
  client_id: meter-service

# Keep-awake poke (measured on FRITZ!SE 250, FritzOS 8.25):
# On battery the device transmits every 120s. Reading getbasicdevicestats makes
# the box query it, which holds a 10s transmit rate; the hold expires ~126s
# after the last read, so the device falls back on its own -- there is no
# command to undo. AVM exposes no setting for this; USB power does NOT disable
# the 120s mode (tested). Needs only the "Smart Home" box permission.
# Off by default: 120s is fine for data collection and holding the device awake
# costs battery. The battery manager toggles it at runtime by publishing
# on/off to <topic_prefix>/cmd/keep_awake (publish it retained so the state
# survives a restart of this service).
keep_awake:
  # The persisted state file wins over `enabled`, and a live/retained MQTT
  # command wins over both. The file exists because retained commands are NOT
  # durable here: mosquitto.conf sets no `persistence`, so the nightly reboot
  # restarts the broker container and wipes every retained message.
  enabled: false             # fallback only, used when no state file exists
  state_path: /home/pi/GLaDOSHomeAssistant/meter/data/keep_awake.json
  interval_s: 60.0           # must stay well under the ~126s hold
  allow_mqtt_toggle: true    # honour <topic_prefix>/cmd/keep_awake

# 5-minute power history, recorded from the box's own 1-hour statistics buffer
# rather than from our MQTT stream: polling every 30 min against a 60 min
# buffer gives 2x overlap, so data recorded while this service was down is
# still picked up. Served by meter-history.service.
# NOTE: reading that buffer is also the keep-awake trigger, so each poll holds
# the device in 10s mode for ~2 min (~7% duty cycle at 30 min intervals).
history:
  enabled: true
  interval_s: 1800.0         # 30 min against the 60 min buffer
  retry_s: 60.0              # retry gap after a FAILED poll. Deliberately short:
                             # the first poll after the nightly reboot can fail
                             # while the network comes up, and waiting a full
                             # interval could push the next read past the
                             # 1-hour buffer and lose that data for good.
  db_path: /home/pi/GLaDOSHomeAssistant/meter/data/history.db

# Failure notifications to ntfy (self-hosted). Edge-triggered: one message when
# a condition has persisted long enough to be real, one when it clears, nothing
# in between -- the poll loop runs every 5s, so anything else would be a storm.
# The URL contains the topic name, which IS the access credential, so it lives
# in /etc/meter.env as NTFY_URL and never in this file.
notify:
  enabled: true
  url: null                  # null => NTFY_URL from the environment
  min_duration_s: 60.0       # a failure must persist this long ...
  min_count: 5               # ... or recur this often, before anything is sent
  timeout_s: 10.0
  max_per_hour: 12           # backstop against a notification storm
  notify_recovery: true      # also send the "back to normal" message

simulate:
  send_period_s: 60.0        # simulated device update period (real one: measure, spec section 2)
  base_load_w: 180.0
  pv_peak_w: 2500.0          # set 0 to disable simulated feed-in
  seed: null
